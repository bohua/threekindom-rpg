# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: core_engine_or_asset_reference
    status: active
    description: "ThreeKingdoms.Core (battle rules) must not reference UnityEngine, ScriptableObjects or save DTOs."
    why: "Rules stay testable in EditMode and independent of data/persistence formats (ADR-0001 layering)."
    adr: docs/architecture/adr-0002-battle-core.md
    added: 2026-10-19
  - pattern: battle_rules_nondeterminism
    status: active
    description: "Battle rules must not use random numbers, time, frame counts, logging or I/O."
    why: "Same input and commands must give the same result on every platform; retries and tests depend on it."
    adr: docs/architecture/adr-0002-battle-core.md
    added: 2026-10-19
  - pattern: enemy_ai_reads_player_commands
    status: active
    description: "Enemy AI must only receive the round-start BattleView, never the player's commands for the round."
    why: "Combat GDD: AI choices are independent of the player's pending commands."
    adr: docs/architecture/adr-0002-battle-core.md
    added: 2026-10-19
  - pattern: battle_writes_out_of_battle_state
    status: active
    description: "Combat must not write exp, inventory, copper, story flags or snapshots; it only hands back BattleResult."
    why: "Those states belong to progression, equipment-items, story-events and save-system."
    adr: docs/architecture/adr-0002-battle-core.md
    added: 2026-10-19
  - pattern: hardcoded_battle_numbers
    status: active
    description: "Advantage, guard, modifier floor, heal ratios and troop-type numbers must come from data, never literals in rule code."
    why: "Combat GDD: all variables are data-driven; tuning must not need code changes."
    adr: docs/architecture/adr-0002-battle-core.md
    added: 2026-10-19

