# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: battle_damage_arithmetic
    status: active
    api: "integer fixed-point (long) in BattleRules.Damage, single floor division"
    not: "float / decimal"
    adr: docs/architecture/adr-0002-battle-core.md
    reason: "Exact GDD examples (40.8 → 21) and identical results on every platform and scripting backend"
    referenced_by:
      - docs/architecture/adr-0002-battle-core.md
    added: 2026-10-19
    revised: ""
  - purpose: temporary_cjk_ui_font
    status: active
    api: "Font.CreateDynamicFontFromOSFont + FontDefinition.FromFont (BattleFont), Windows only"
    not: "bundled third-party font files before ADR-0007"
    adr: docs/architecture/adr-0002-battle-core.md
    reason: "Development / validation builds until ADR-0007 ships a licensed bundled font"
    referenced_by:
      - docs/architecture/adr-0002-battle-core.md
    added: 2026-10-19
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
